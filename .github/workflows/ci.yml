name: CI/CD Pipeline

on:
    push:
        branches: [master, main, develop]
    pull_request:
        branches: [master, main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Install FlatBuffers
              run: |
                  wget https://github.com/google/flatbuffers/releases/download/v23.5.26/Linux.flatc.binary.g++-10.zip
                  unzip Linux.flatc.binary.g++-10.zip
                  chmod +x flatc
                  sudo mv flatc /usr/local/bin/

            - name: Build with Maven
              run: mvn clean package -DskipTests -Dflatc.executable=/usr/local/bin/flatc

            - name: Run Tests
              run: mvn test -Dflatc.executable=/usr/local/bin/flatc

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: eternity-jar
                  path: target/*.jar

    docker:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker Image
              run: docker build -t eternity-server .

            - name: Run Container Test
              run: |
                  docker run -d --name eternity-test eternity-server
                  sleep 5
                  docker logs eternity-test
                  docker stop eternity-test

    benchmark:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Install FlatBuffers
              run: |
                  wget https://github.com/google/flatbuffers/releases/download/v23.5.26/Linux.flatc.binary.g++-10.zip
                  unzip Linux.flatc.binary.g++-10.zip
                  chmod +x flatc
                  sudo mv flatc /usr/local/bin/

            - name: Build
              run: mvn clean package -DskipTests -Dflatc.executable=/usr/local/bin/flatc

            - name: Run Benchmark
              run: java -cp target/eternity-1.0-SNAPSHOT.jar org.game.eternity2.server.benchmark.SimpleBenchmark
