apiVersion: v1
kind: Service
metadata:
  name: eternity-server
spec:
  selector:
    app: eternity-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 50051
      targetPort: 50051
      name: grpc
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eternity-server
  labels:
    app: eternity-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eternity-server
  template:
    metadata:
      labels:
        app: eternity-server
    spec:
      containers:
      - name: eternity-server
        image: eternity-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        - containerPort: 50051
        env:
        - name: REDIS_HOST
          value: "redis-0.redis"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
