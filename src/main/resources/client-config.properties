# Client Configuration
# Eternity II Distributed Solver

# Network settings
client.server.host=127.0.0.1
client.server.port=12345
client.reconnect.attempts=5
client.reconnect.delay.seconds=5

# User credentials
client.username=auto
client.password=password

# Job execution
job.executor.threads=1
job.max.backtrack.depth=1000
job.timeout.seconds=300

# Statistics
stats.update.interval.seconds=2
stats.log.enabled=true

# Persistence
solutions.local.save=false
solutions.directory=client_solutions

# Logging
log.level=INFO
log.timestamps=true
