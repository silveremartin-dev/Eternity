# Server Configuration
# Eternity II Distributed Solver

# Network settings
server.port=12345
server.max.clients=100

# Job settings
job.strategy=BorderFirstStrategy
job.timeout.seconds=300
job.retry.attempts=3

# Persistence
solutions.auto.save=true
solutions.directory=solutions
solutions.save.interval.seconds=60

# Statistics
stats.update.interval.seconds=2
stats.log.enabled=true

# User database
user.database.file=users.dat
user.auto.register=true

# Logging
log.level=INFO
log.timestamps=true
log.packet.ids=true
